services:
  # ==========================================
  # App Service (Laravel PHP-FPM 8.3)
  # ==========================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sda_kas_app
    restart: unless-stopped
    working_dir: /var/www
    environment:
      APP_NAME: "SDA Kas Web"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "http://43.157.243.62:8081"
      LOG_CHANNEL: stack
      LOG_LEVEL: error
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: sda_kas_web
      DB_USERNAME: frgtx
      DB_PASSWORD: asddsa123
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      FILESYSTEM_DISK: public
      FRESH_SEED: "false"
    volumes:
      - storage_data:/var/www/storage/app/public
    networks:
      - sda_network
    depends_on:
      db:
        condition: service_healthy

  # ==========================================
  # Web Server Service (Nginx)
  # ==========================================
  webserver:
    image: nginx:alpine
    container_name: sda_kas_webserver
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - .:/var/www
      - storage_data:/var/www/public/storage
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - sda_network
    depends_on:
      - app

  # ==========================================
  # Database Service (MySQL 8.0)
  # ==========================================
  db:
    image: mysql:8.0
    container_name: sda_kas_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: t3g4lr3j0
      MYSQL_DATABASE: sda_kas_web
      MYSQL_USER: frgtx
      MYSQL_PASSWORD: asddsa123
    volumes:
      - sda_kas_mysql_data:/var/lib/mysql
    networks:
      - sda_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "frgtx", "-pasddsa123"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  sda_kas_mysql_data:
    driver: local
  storage_data:
    driver: local

networks:
  sda_network:
    driver: bridge
